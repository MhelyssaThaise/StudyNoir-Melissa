STUDYNOIR_EOF
          base64 -d /tmp/studynoir.tar.gz.b64 > /tmp/studynoir.tar.gz
          tar -xzf /tmp/studynoir.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk StudyNoir-Melissa.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyNoir-Melissa-APK
          path: StudyNoir-Melissa.apk
          retention-days: 30
